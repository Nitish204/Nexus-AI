<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0d16"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="core" cx="256" cy="256" r="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </radialGradient>
    <radialGradient id="node" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(30)">
      <stop offset="0" stop-color="#ddd6fe"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </radialGradient>
  </defs>

  <!-- Background: filled full-bleed so this also works as a maskable icon
       (Android crops to a circle; keeping every element inside the
       center ~80% "safe zone" means nothing important gets clipped). -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Orchestration graph: one coordinator node (center) connected to
       four agent nodes — a direct visual reference to NEXUS's
       multi-agent architecture (product manager / backend / frontend
       / QA-devops), not just decorative geometry. -->
  <g stroke="url(#edge)" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="256" x2="166" y2="166"/>
    <line x1="256" y1="256" x2="346" y2="166"/>
    <line x1="256" y1="256" x2="166" y2="346"/>
    <line x1="256" y1="256" x2="346" y2="346"/>
  </g>

  <!-- Outer agent nodes -->
  <circle cx="166" cy="166" r="26" fill="url(#node)"/>
  <circle cx="346" cy="166" r="26" fill="url(#node)"/>
  <circle cx="166" cy="346" r="26" fill="url(#node)"/>
  <circle cx="346" cy="346" r="26" fill="url(#node)"/>

  <!-- Center coordinator node, largest -->
  <circle cx="256" cy="256" r="62" fill="url(#core)"/>
  <circle cx="256" cy="256" r="62" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
</svg>

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-backend
  labels:
    app: nexus-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-backend
  template:
    metadata:
      labels:
        app: nexus-backend
    spec:
      containers:
        - name: nexus-backend
          image: nexus-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: nexus-backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-backend-svc
spec:
  selector:
    app: nexus-backend
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: v1
kind: Secret
metadata:
  name: nexus-backend-secrets
type: Opaque
stringData:
  SECRET_KEY: "change-me"
  JWT_SECRET: "change-me"
  DATABASE_URL: "postgresql+asyncpg://nexus:nexus@postgres:5432/nexus"
  GROQ_API_KEY: ""
  GOOGLE_CLIENT_ID: ""
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
